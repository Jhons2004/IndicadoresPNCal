<!DOCTYPE html>
<html lang="es">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Sistema DSNC</title>
  <style>
    :root {
      --primary: #315bdc;
      --primary2: #10b981;
      --text: #0f172a;
      --muted: #64748b;
      --danger: #dc2626;
      --success: #16a34a;
      --white: #ffffff;
      --border: rgba(255,255,255,.28);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 20% 10%, rgba(16,185,129,.38), transparent 28%),
        radial-gradient(circle at 90% 20%, rgba(49,91,220,.50), transparent 32%),
        linear-gradient(135deg, #172554 0%, #315bdc 55%, #0f766e 100%);
      display: grid;
      place-items: center;
      padding: 20px;
      color: var(--white);
    }
    .login-wrap { width: min(440px, 100%); }
    .header { text-align: center; margin-bottom: 24px; }
    .logo {
      width: 90px; height: 90px; border-radius: 28px;
      display: grid; place-items: center;
      margin: 0 auto 16px;
      background: rgba(255,255,255,.17);
      border: 1px solid rgba(255,255,255,.25);
      box-shadow: 0 20px 55px rgba(0,0,0,.22);
      font-size: 26px; font-weight: 900;
    }
    h1 { margin: 0; font-size: 32px; letter-spacing: -.05em; }
    .subtitle { margin: 8px 0 0; opacity: .82; line-height: 1.35; }
    .card {
      background: rgba(255,255,255,.13);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,.26);
      border-radius: 26px;
      padding: 28px;
      box-shadow: 0 28px 90px rgba(0,0,0,.28);
    }
    .field { display: grid; gap: 8px; margin-bottom: 16px; }
    label { font-weight: 900; font-size: 14px; }
    input {
      width: 100%; min-height: 48px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.32);
      background: rgba(255,255,255,.16);
      color: #fff;
      padding: 12px 14px;
      outline: none;
      font-size: 16px;
    }
    input::placeholder { color: rgba(255,255,255,.65); }
    input:focus {
      border-color: #fff;
      box-shadow: 0 0 0 4px rgba(255,255,255,.12);
      background: rgba(255,255,255,.22);
    }
    .pass-wrap { position: relative; }
    .eye {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      background: transparent; border: 0; color: white; font-size: 18px; cursor: pointer;
      width: 36px; height: 36px;
    }
    .row {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; margin: 4px 0 18px;
    }
    .remember { display: flex; align-items: center; gap: 8px; font-size: 14px; color: rgba(255,255,255,.82); }
    .remember input { width: 16px; height: 16px; min-height: auto; }
    .help { background: transparent; border: 0; color: #fff; opacity: .85; cursor: pointer; font-weight: 800; }
    .btn {
      width: 100%; min-height: 50px;
      border: 0; border-radius: 15px;
      background: #fff; color: var(--primary);
      font-weight: 900; font-size: 16px;
      box-shadow: 0 14px 30px rgba(15,23,42,.18);
      cursor: pointer; transition: .18s ease;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn:disabled { opacity: .72; cursor: not-allowed; transform: none; }
    .msg {
      display: none;
      margin-top: 14px;
      border-radius: 14px;
      padding: 12px 13px;
      font-weight: 800;
      font-size: 14px;
      line-height: 1.35;
    }
    .msg.show { display: block; }
    .msg.error { background: rgba(220,38,38,.22); border: 1px solid rgba(252,165,165,.40); color: #fecaca; }
    .msg.success { background: rgba(22,163,74,.22); border: 1px solid rgba(134,239,172,.42); color: #bbf7d0; }
    .demo { margin-top: 22px; padding-top: 18px; border-top: 1px solid rgba(255,255,255,.18); }
    .demo-title { text-align: center; font-size: 12px; opacity: .72; margin-bottom: 10px; font-weight: 900; }
    .demo-card {
      display: flex; justify-content: space-between; gap: 10px; align-items: center;
      padding: 12px; border-radius: 14px;
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.14);
      cursor: pointer; transition: .16s ease;
      margin-bottom: 10px;
    }
    .demo-card:hover { background: rgba(255,255,255,.18); transform: translateY(-1px); }
    .demo-card strong { display: block; }
    .demo-card span { font-size: 12px; opacity: .75; }
    .tag { border-radius: 999px; background: rgba(255,255,255,.18); padding: 5px 9px; font-size: 11px; font-weight: 900; }
    .footer { text-align: center; margin-top: 22px; font-size: 12px; opacity: .7; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="header">
      <div class="logo">DSNC</div>
      <h1>Sistema DSNC</h1>
      <p class="subtitle">Dirección del Sistema Nacional de la Calidad<br>Indicadores PNCal</p>
    </div>

    <div class="card">
      <form id="loginForm">
        <div class="field">
          <label for="username">Usuario</label>
          <input id="username" name="username" autocomplete="username" required placeholder="usuario.departamento">
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <div class="pass-wrap">
            <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="••••••••">
            <button type="button" class="eye" onclick="togglePassword()">👁️</button>
          </div>
        </div>

        <div class="row">
          <label class="remember"><input id="rememberMe" type="checkbox"> Recordarme</label>
          <button type="button" class="help" onclick="showHelp()">Ayuda</button>
        </div>

        <button id="loginBtn" class="btn" type="submit">Iniciar sesión</button>
        <div id="messageBox" class="msg"></div>
      </form>

    <div class="footer">© 2026 Dirección del Sistema Nacional de la Calidad</div>
  </div>

  <script>
    const APP_URL = <?!= JSON.stringify(appUrl || '') ?>;
    let isLoggingIn = false;

    function byId(id) { return document.getElementById(id); }

    function getAppUrl() {
      return APP_URL || String(window.location.href || '').split('?')[0];
    }

    function togglePassword() {
      const p = byId('password');
      p.type = p.type === 'password' ? 'text' : 'password';
    }

    function showMessage(type, text) {
      const box = byId('messageBox');
      box.className = 'msg show ' + type;
      box.textContent = text || '';
    }

    function hideMessage() {
      const box = byId('messageBox');
      box.className = 'msg';
      box.textContent = '';
    }

    function showHelp() {
      showMessage('success', 'Ingrese con un usuario activo de la hoja Usuario. Para administrar, el rol debe ser Administrador.');
    }

    function normalizePage(page) {
      page = String(page || '').trim();
      if (!page) return 'administrativo';
      if (page === 'admin-dashboard' || page === 'admin' || page === 'dashboard') return 'administrativo';
      return page;
    }

    function saveAuth(username, password, user, targetPage) {
      const auth = {
        username: String(username || '').trim().toLowerCase(),
        password: String(password || ''),
        user: user || {},
        targetPage: normalizePage(targetPage || (user && user.targetPage) || 'administrativo'),
        loginTime: new Date().toISOString(),
        appUrl: getAppUrl()
      };

      sessionStorage.setItem('dsnc_auth', JSON.stringify(auth));
      sessionStorage.setItem('dsnc_active', 'true');
      localStorage.setItem('dsnc_user', JSON.stringify({
        username: auth.username,
        name: auth.user.name || auth.username,
        department: auth.user.department || '',
        role: auth.user.role || '',
        targetPage: auth.targetPage,
        loginTime: auth.loginTime
      }));

      if (byId('rememberMe').checked) {
        localStorage.setItem('dsnc_remember_user', auth.username);
      }

      return auth;
    }

    function clearOldSessions() {
      localStorage.removeItem('dsnc_session');
      sessionStorage.removeItem('dsnc_session');
    }

    function checkExistingSession() {
      clearOldSessions();
      try {
        const raw = sessionStorage.getItem('dsnc_auth') || '';
        if (!raw) return false;

        const auth = JSON.parse(raw);
        if (!auth.username || !auth.password) return false;

        const loginTime = auth.loginTime ? new Date(auth.loginTime) : new Date(0);
        const hours = (new Date() - loginTime) / (1000 * 60 * 60);
        if (hours >= 24) {
          sessionStorage.removeItem('dsnc_auth');
          sessionStorage.removeItem('dsnc_active');
          return false;
        }

        const page = normalizePage(auth.targetPage || 'administrativo');
        window.top.location.href = getAppUrl() + '?page=' + encodeURIComponent(page);
        return true;
      } catch (e) {
        return false;
      }
    }

    function dsncLogin(username, password) {
      return new Promise(function(resolve) {
        google.script.run
          .withSuccessHandler(function(result) { resolve(result || { success: false, message: 'Respuesta vacía del servidor.' }); })
          .withFailureHandler(function(error) { resolve({ success: false, message: error && error.message ? error.message : String(error) }); })
          .dsncLogin(username, password);
      });
    }

    byId('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      if (isLoggingIn) return;

      const username = byId('username').value.trim();
      const password = byId('password').value;
      if (!username || !password) {
        showMessage('error', 'Complete usuario y contraseña.');
        return;
      }

      isLoggingIn = true;
      byId('loginBtn').disabled = true;
      byId('loginBtn').textContent = 'Validando...';
      hideMessage();

      const result = await dsncLogin(username, password);

      if (!result.success) {
        showMessage('error', result.message || 'No fue posible iniciar sesión.');
        isLoggingIn = false;
        byId('loginBtn').disabled = false;
        byId('loginBtn').textContent = 'Iniciar sesión';
        return;
      }

      const user = result.user || {};
      const page = normalizePage(result.targetPage || result.page || user.targetPage || 'administrativo');
      saveAuth(username, password, user, page);

      showMessage('success', 'Acceso concedido. Redirigiendo...');
      byId('loginBtn').textContent = 'Acceso concedido';

      setTimeout(function() {
        const redirectUrl = result.redirectUrl || (getAppUrl() + '?page=' + encodeURIComponent(page));
        window.top.location.href = redirectUrl;
      }, 500);
    });

    document.addEventListener('click', function(e) {
      const card = e.target.closest('[data-username]');
      if (!card) return;
      byId('username').value = card.getAttribute('data-username') || '';
      byId('password').value = card.getAttribute('data-password') || '';
      byId('loginBtn').focus();
    });

    document.addEventListener('DOMContentLoaded', function() {
      const remembered = localStorage.getItem('dsnc_remember_user') || '';
      if (remembered) {
        byId('username').value = remembered;
        byId('rememberMe').checked = true;
      }

      if (!checkExistingSession()) {
        byId('username').focus();
      }
    });
  </script>
</body>
</html>
